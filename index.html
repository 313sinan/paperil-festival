<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Rendezvous</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --accent:#e2952e;
  --accent-dark:#b6721a;
  --ink:#20211d;
  --cement:#eeece4;
  --cement-2:#e2dfd4;
  --white:#fbfaf7;
  --line:#d8d4c6;
  --danger:#c1443a;
  --good:#3f7d54;
  --radius:14px;
  --shadow:0 2px 10px rgba(32,33,29,0.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--cement);
  color:var(--ink);
  overscroll-behavior-y:none;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--white);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.06);}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;font-size:15px;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--ink);color:var(--white);
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  gap:8px;
}
.topbar .brand{font-weight:800;letter-spacing:.3px;font-size:16px;display:flex;align-items:center;gap:8px;}
.topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.topbar .actions{display:flex;gap:8px;align-items:center;}
.iconbtn{background:rgba(255,255,255,0.12);color:var(--white);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;transition:background .15s ease, transform .15s ease;}
.iconbtn:active{transform:scale(.9);}
@media (hover:hover){ .iconbtn:hover{background:rgba(255,255,255,0.22);} }
.badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

/* ---------- content ---------- */
.content{flex:1;padding:14px 14px 90px;overflow-y:auto;}
.screen{display:none;}
.screen.active{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- login landing ---------- */
.hero{
  text-align:center;padding:34px 10px 20px;
}
.hero-banner{width:100%;border-radius:0 0 22px 22px;overflow:hidden;margin:0 0 4px;box-shadow:var(--shadow);}
.hero-banner img{width:100%;display:block;max-height:220px;object-fit:cover;animation:kenBurns 6s ease-out forwards;}
@keyframes kenBurns{0%{transform:scale(1.18);}100%{transform:scale(1);}}
@keyframes animIn{
  0%{opacity:0;transform:translateY(26px) scale(.88) rotate(-2deg);}
  60%{opacity:1;transform:translateY(-4px) scale(1.02) rotate(.5deg);}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0);}
}
.anim-in{opacity:0;animation:animIn .7s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes floatIcon{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-5px) rotate(-4deg);}}
.login-card .ic{animation:floatIcon 2.6s ease-in-out infinite;}
.login-card:nth-child(1) .ic{animation-delay:.1s;}
.login-card:nth-child(2) .ic{animation-delay:.35s;}
.login-card:nth-child(3) .ic{animation-delay:.6s;}
.login-card{transition:transform .15s ease, box-shadow .15s ease;}
.login-card:active{transform:scale(.96) rotate(-.5deg);}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(226,149,46,.55);}70%{box-shadow:0 0 0 7px rgba(226,149,46,0);}}
.brand .dot{animation:dotPulse 1.8s ease-out infinite;}
.hero-banner{position:relative;}
.hero-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);background-size:250% 100%;background-position:150% 0;animation:shimmerSweep 1.6s ease-out .3s 1;}
@keyframes shimmerSweep{to{background-position:-50% 0;}}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--cement-2);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pageIn{from{opacity:0;transform:translateY(8px) scale(.985);}to{opacity:1;transform:none;}}
.page-anim{animation:pageIn .28s cubic-bezier(.22,.8,.4,1);}
@keyframes crownBounce{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-3px) rotate(6deg);}}
.crown-bounce{display:inline-block;animation:crownBounce 1.4s ease-in-out infinite;}
.hero h1{font-size:26px;margin:6px 0 2px;letter-spacing:.2px;}
.hero p{color:#6b6a62;font-size:14px;margin:0;}
.login-grid{display:flex;flex-direction:column;gap:12px;margin-top:24px;}
.login-card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);
}
.login-card .ic{width:46px;height:46px;border-radius:12px;background:var(--cement-2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;}
.login-card .txt b{display:block;font-size:16px;}
.login-card .txt span{font-size:12.5px;color:#7a7a72;}
.login-card:active{transform:scale(.98);}
@media (hover:hover){ .login-card:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(32,33,29,0.12);} }

/* ---------- cards / lists ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;}
@media (hover:hover){ .card:hover{box-shadow:0 6px 20px rgba(32,33,29,0.1);transform:translateY(-1px);border-color:#cfcabb;} }
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between;}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 6px;border-bottom:1px solid var(--cement-2);gap:10px;border-radius:8px;transition:background .15s ease;margin:0 -6px;}
@media (hover:hover){ .row:hover{background:var(--cement-2);} }
.row:last-child{border-bottom:none;}
.row .main b{display:block;font-size:14.5px;}
.row .main span{font-size:12px;color:#7a7a72;}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--cement-2);color:var(--ink);white-space:nowrap;font-weight:600;transition:transform .15s ease;}
.pill.accent{background:var(--accent);color:#fff;}
.pill.good{background:#e4f1e7;color:var(--good);}
.pill.danger{background:#f8e6e4;color:var(--danger);}
.pill.grey{background:#eee;color:#888;}

label{display:block;font-size:12.5px;color:#6b6a62;margin:10px 0 4px;font-weight:600;}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--white);outline:none;
  transition:border-color .2s ease, box-shadow .2s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,0.07);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;width:100%;
  transition:opacity .15s ease, transform .15s ease, box-shadow .2s ease, filter .15s ease;
}
@media (hover:hover){ .btn:hover{filter:brightness(1.06);box-shadow:0 4px 14px rgba(32,33,29,0.16);} .btn.outline:hover{background:var(--cement-2);} }
.btn.accent{background:var(--accent);}
.btn.outline{background:transparent;border:1.5px solid var(--ink);color:var(--ink);}
.btn.danger{background:var(--danger);}
.btn.good{background:var(--good);}
.btn.small{width:auto;padding:8px 12px;font-size:13px;}
.btn:active{opacity:.85;transform:scale(.97);}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btnrow{display:flex;gap:8px;margin-top:10px;}
.btnrow .btn{flex:1;}

.searchbar{display:flex;gap:8px;margin-bottom:12px;}
.searchbar input{flex:1;}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:none;padding:8px 13px;border-radius:99px;background:var(--cement-2);font-size:13px;font-weight:600;color:#565550;transition:background .2s, color .2s, transform .15s;}
.tab:active{transform:scale(.95);}
.tab.active{background:var(--ink);color:#fff;}

.empty{text-align:center;padding:30px 10px;color:#8a8980;font-size:13.5px;}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:sticky;bottom:0;left:0;right:0;background:var(--white);
  border-top:1px solid var(--line);display:flex;z-index:20;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;background:transparent;color:#8a8980;font-size:10.5px;font-weight:700;transition:color .2s, transform .15s;}
.navbtn:active{transform:scale(.92);}
.navbtn.active .ic{animation:navPop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes navPop{0%{transform:scale(1);}45%{transform:scale(1.28);}100%{transform:scale(1);}}
.navbtn .ic{font-size:18px;}
.navbtn.active{color:var(--accent);}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,20,18,0.5);display:none;align-items:flex-end;justify-content:center;z-index:100;opacity:0;transition:opacity .2s ease;}
.overlay.show{opacity:1;}
.overlay.show{display:flex;}
.modal{background:var(--white);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;animation:up .2s ease;}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 4px;font-size:17px;}
.modal .sub{font-size:12.5px;color:#7a7a72;margin-bottom:8px;}
.closebar{width:38px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 12px;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) scale(.7);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s, transform .3s cubic-bezier(.34,1.56,.64,1), bottom .25s;box-shadow:var(--shadow);}
.toast.show{opacity:1;bottom:100px;transform:translateX(-50%) scale(1);}

.colorswatch{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--white);box-shadow:0 0 0 1px var(--line);}
.sw.on{box-shadow:0 0 0 2px var(--ink);}

.poster-img{width:100%;border-radius:10px;display:block;margin-bottom:8px;object-fit:cover;max-height:260px;}
.notedot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;}

.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.stat{background:var(--cement-2);border-radius:12px;padding:12px 8px;text-align:center;}
.stat b{display:block;font-size:20px;}
.stat span{font-size:10.5px;color:#6b6a62;}

.chip{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--cement-2);margin:2px 4px 2px 0;}
.linkbtn{background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px;}
.small-note{font-size:11.5px;color:#8a8980;margin-top:6px;}
.loading{text-align:center;padding:60px 10px;color:#8a8980;}
.progressbar{height:8px;background:var(--cement-2);border-radius:99px;overflow:hidden;margin-top:6px;}
.progressbar div{height:100%;background:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar" style="display:none;">
    <div class="brand"><span class="dot"></span><span id="brandName">Rendezvous</span></div>
    <div class="actions" id="topbarActions"></div>
  </div>
  <div class="content" id="content">
    <div class="loading" id="loadingScreen"><div class="spinner"></div>Loading Rendezvous…</div>
  </div>
  <div class="bottomnav" id="bottomnav" style="display:none;"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

    async delete(key, shared){

/* ---------------- storage helpers ---------------- */
// Extra safety net: every time a key is successfully read from or written
// to shared storage, also keep a timestamped copy in THIS device's own
// browser storage. If shared storage ever comes back empty/corrupted, an
// admin can restore from this local mirror without needing a manually
// downloaded backup file.
const MIRROR_PREFIX = 'rdv_mirror_';
function mirrorSave(key, value){
  try{ localStorage.setItem(MIRROR_PREFIX+key, JSON.stringify({value, at: Date.now()})); }catch(e){}
}
function mirrorLoad(key){
  try{ const raw = localStorage.getItem(MIRROR_PREFIX+key); return raw? JSON.parse(raw) : null; }catch(e){ return null; }
}
async function loadKey(key, fallback){
  if(sb){
    try{
      const { data, error } = await sb.from('rdv_kv').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      const val = data ? data.value : fallback;
      if(data) mirrorSave(key, val);
      return val;
    }catch(e){ /* fall through to the backup storage tier below */ }
  }
  for(let attempt=1; attempt<=4; attempt++){
    try{
      const r = await window.storage.get(key, true);
      const val = r ? JSON.parse(r.value) : fallback;
      if(r) mirrorSave(key, val);
      return val;
    }catch(e){
      if(attempt<4) await new Promise(res=>setTimeout(res, 400*attempt));
    }
  }
  return fallback;
}
async function saveKey(key, value){
  if(sb){
    try{
      const { error } = await sb.from('rdv_kv').upsert({ key, value, updated_at: new Date().toISOString() });
      if(error) throw error;
      mirrorSave(key, value);
      return true;
    }catch(e){ /* fall through to the backup storage tier below */ }
  }
  const payload = JSON.stringify(value);
  for(let attempt=1; attempt<=3; attempt++){
    try{
      const r = await window.storage.set(key, payload, true);
      if(r){ mirrorSave(key, value); return true; }
    }catch(e){ /* retry */ }
    if(attempt<3) await new Promise(res=>setTimeout(res, 500*attempt));
  }
  toast("Save failed — check connection and try again");
  return false;
}
// Re-fetch one key fresh from shared storage right before we mutate it.
// This means our change is applied on top of everyone else's latest data,
// instead of possibly overwriting what another phone just saved.
async function pull(key){
  const fallback = STATE[key];
  STATE[key] = await loadKey(key, fallback);
  return STATE[key];
}

async function loadAll(){
  const prev = STATE; // whatever we already have in memory (null on first boot)
  const d = defaultState();
  const [settings,teams,students,competitions,posters,toppers,messages,notifications,published] = await Promise.all([
    loadKey("settings", prev ? prev.settings : null),
    loadKey("teams", prev ? prev.teams : null),
    loadKey("students", prev ? prev.students : []),
    loadKey("competitions", prev ? prev.competitions : []),
    loadKey("posters", prev ? prev.posters : []),
    loadKey("toppers", prev ? prev.toppers : []),
    loadKey("messages", prev ? prev.messages : []),
    loadKey("notifications", prev ? prev.notifications : []),
    loadKey("published", prev ? prev.published : null)
  ]);
  STATE = {
    settings: Object.assign({}, d.settings, settings || {}),
    teams: teams || (prev ? prev.teams : d.teams),
    students, competitions, posters, toppers, messages, notifications,
    published: Object.assign({}, d.published, published || {})
  };
  if(!settings) await saveKey("settings", STATE.settings);
  if(!teams) await saveKey("teams", STATE.teams);
  if(!published) await saveKey("published", STATE.published);
  applyTheme();
}

function applyTheme(){
  document.documentElement.style.setProperty('--accent', STATE.settings.siteColor);
  // derive a darker shade roughly
  document.documentElement.style.setProperty('--accent-dark', shade(STATE.settings.siteColor, -18));
}
function shade(hex, percent){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  let r=(num>>16)+percent, g=((num>>8)&0x00FF)+percent, b=(num&0x0000FF)+percent;
  r=Math.max(Math.min(255,r),0); g=Math.max(Math.min(255,g),0); b=Math.max(Math.min(255,b),0);
  return "#"+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}

function adminOverviewHtml(){
  const totalStudents = STATE.students.length;
  const totalEvents = STATE.competitions.length;
  const live = STATE.competitions.filter(e=>e.status==='started').length;
  const teamRows = STATE.teams.map(t=>{
    const pts = draftTeamPoints(t.id);
    return `<div class="row"><div class="main"><b>${esc(t.name)}</b><span>${teamStudentCount(t.id)} students</span></div><div class="pill accent">${pts} pts (live)</div></div>`;
  }).join('');
  const pubRows = STATE.teams.map(t=>{
    const p = STATE.published.teamPoints[t.id]||0;
    return `<div class="row"><div class="main"><b>${esc(t.name)}</b></div><div class="pill good">${p} pts (published)</div></div>`;
  }).join('');
  return `
    <div class="statgrid">
      <div class="stat"><b>${totalStudents}</b><span>Students</span></div>
      <div class="stat"><b>${totalEvents}</b><span>Events</span></div>
      <div class="stat"><b>${live}</b><span>Live now</span></div>
    </div>
    <div class="card"><h3>Live standings (admin-only, not published)</h3>${teamRows}</div>
    <div class="card"><h3>Published standings <button class="linkbtn" onclick="publishResults()">Publish now</button></h3>${pubRows}<div class="small-note">Publishing updates what Students &amp; Leaders can see. Nothing new shows to them until you publish again.</div></div>
    <div class="card"><h3>Top 5 per category</h3>${top5Html()}</div>
  `;
}
function teamStudentCount(teamId){ return STATE.students.filter(s=>s.teamId===teamId).length; }
function draftTeamPoints(teamId){
  let pts = 0;
  STATE.competitions.forEach(ev=>{
    if(ev.category==='General'){
      pts += (ev.generalMarks && ev.generalMarks[teamId]) ? Number(ev.generalMarks[teamId]) : 0;
    } else {
      (ev.participants||[]).forEach(p=>{
        const st = STATE.students.find(s=>s.id===p.studentId);
        if(st && st.teamId===teamId && p.marks) pts += Number(p.marks);
      });
    }
  });
  return pts;
}
function top5Html(){
  const scores = {};
  STATE.students.forEach(s=>scores[s.id]=0);
  STATE.competitions.forEach(ev=>{
    if(ev.category==='General') return;
    (ev.participants||[]).forEach(p=>{ if(p.marks) scores[p.studentId]=(scores[p.studentId]||0)+Number(p.marks); });
  });
  const groups = {};
  CATEGORIES.filter(c=>c!=='General').forEach(cat=>groups[cat]=[]);
  STATE.students.forEach(s=>{ if(groups[s.category]) groups[s.category].push({name:s.name,score:scores[s.id]||0,team:teamName(s.teamId)}); });
  return Object.keys(groups).map(cat=>{
    const top = groups[cat].sort((a,b)=>b.score-a.score).slice(0,5).filter(x=>x.score>0);
    return `<div style="margin-bottom:10px;"><b style="font-size:13px;">${cat}</b>${top.length? top.map((t,i)=>`<div class="row"><div class="main"><b>${i+1}. ${esc(t.name)}</b><span>${esc(t.team)}</span></div><div class="pill">${t.score}</div></div>`).join('') : '<div class="small-note">No marks yet</div>'}</div>`;
  }).join('');
}
function teamName(id){ const t=STATE.teams.find(t=>t.id===id); return t?t.name:'—'; }

async function publishResults(){
  await pull('competitions'); await pull('teams'); await pull('students');
  const pts = {};
  STATE.teams.forEach(t=>pts[t.id]=draftTeamPoints(t.id));
  const results = {};
  STATE.competitions.forEach(ev=>{
    results[ev.id] = (ev.participants||[]).map(p=>({studentId:p.studentId, marks:p.marks, grade:p.grade||null, position:p.position||null, chestNumber:p.chestNumber||null}));
    if(ev.category==='General') results[ev.id+'_general'] = Object.assign({}, ev.generalMarks);
  });
  STATE.published = { teamPoints: pts, results };
  await save('published');
  toast("Results published");
  render();
}

// shared registration rule-check used by admin & leader
function tryRegister(evId, sid){
  const ev = STATE.competitions.find(e=>e.id===evId);
  const st = STATE.students.find(s=>s.id===sid);
  if(!ev || !st) return {ok:false,msg:"Not found"};
  if(ev.status==='ended') return {ok:false,msg:"Event already ended"};
  if(STATE.settings.registrationDeadline){
    const now = new Date();
    if(now > new Date(STATE.settings.registrationDeadline)) return {ok:false,msg:"Registration deadline has passed"};
  }
  if(ev.category!=='General' && st.category!==ev.category) return {ok:false,msg:"Category doesn't match"};
  const teamCount = (ev.participants||[]).filter(p=>{const s2=STATE.students.find(x=>x.id===p.studentId); return s2 && s2.teamId===st.teamId;}).length;
  if(teamCount>=ev.maxPerTeam) return {ok:false,msg:"Team limit reached for this event"};
  if(ev.maxTotal && (ev.participants||[]).length>=ev.maxTotal) return {ok:false,msg:"Event has reached its max total participants"};
  if(ev.category!=='General'){
    const studentEventCount = STATE.competitions.filter(e=>e.category!=='General' && (e.participants||[]).some(p=>p.studentId===sid)).length;
    if(studentEventCount>=STATE.settings.maxEventsPerStudent) return {ok:false,msg:`Student already has ${STATE.settings.maxEventsPerStudent} events`};
  }
  ev.participants = ev.participants||[];
  ev.participants.push({studentId:sid, marks:null});
  return {ok:true};
}

function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Could not read that image'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read that file'));
    reader.readAsDataURL(file);
  });
}

function computeToppers(source){
  // source: 'draft' uses live marks, 'published' uses last-published snapshot
  const scores = {};
  if(source==='draft'){
    STATE.competitions.forEach(ev=>{
      if(ev.category==='General') return;
      (ev.participants||[]).forEach(p=>{ if(p.marks) scores[p.studentId]=(scores[p.studentId]||0)+Number(p.marks); });
    });
  } else {
    Object.keys(STATE.published.results||{}).forEach(key=>{
      if(key.endsWith('_general')) return;
      (STATE.published.results[key]||[]).forEach(p=>{ if(p.marks) scores[p.studentId]=(scores[p.studentId]||0)+Number(p.marks); });
    });
  }
  return Object.keys(scores).map(sid=>{
    const st = STATE.students.find(s=>s.id===sid);
    return st? {name:st.name, team:teamName(st.teamId), score:scores[sid]} : null;
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,5);
}

async function exportBackup(){

  // Pull every key fresh from shared storage first, so the backup reflects
  // everything that's actually saved — not just whatever this device
  // happened to have in memory at that moment.
  await Promise.all(MIRROR_KEYS.map(k=>pull(k)));
  const backup = {
    exportedAt: new Date().toISOString(),
    settings: STATE.settings, teams: STATE.teams, students: STATE.students,
    competitions: STATE.competitions, posters: STATE.posters, toppers: STATE.toppers,
    messages: STATE.messages, notifications: STATE.notifications, published: STATE.published
  };
  const json = JSON.stringify(backup, null, 2);
  const filename = `rendezvous-backup-${Date.now()}.json`;
  window.__lastBackupJson = json;

  // Try the most reliable option first: the phone's native Share sheet
  // (works inside embedded webviews where plain file downloads often get
  // silently blocked). This call happens directly inside the button click,
  // so it's allowed to trigger native UI.
  try{
    if(navigator.canShare && window.File){
      const file = new File([json], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Rendezvous backup'});
        toast("Backup shared");
        return;
      }
    }
  }catch(e){ /* user cancelled, or share isn't supported here — fall through */ }

  // Fall back to a classic file download.
  let downloadOk = false;
  try{
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    downloadOk = true;
  }catch(e){ downloadOk = false; }
  // Always also show it inline — some mobile browsers/webviews silently
  // block the file download above, so this is the guaranteed fallback:
  // the admin can copy the text and save it anywhere (Notes, WhatsApp, email).
  openModal(`
    <h2>Backup ready</h2>
    <div class="sub">Direct file downloads don't work reliably inside this chat preview — that's expected, not an error. Use one of these instead:</div>
    <div class="btnrow"><button class="btn accent" onclick="shareBackupFile()">📤 Share / Save to Files</button></div>
    <div class="btnrow"><button class="btn outline" onclick="copyBackupText()">📋 Copy backup text</button></div>
    <div class="small-note">"Share" opens your phone's normal share sheet — save it to Files, or send it to yourself on WhatsApp/email. If that's not available, copy the text and paste it into a Notes app instead.</div>
    <textarea readonly rows="6" style="margin-top:10px;font-size:11px;" onclick="this.select()">${esc(json)}</textarea>
  `);
}
async function shareBackupFile(){
  const text = window.__lastBackupJson || '';
  const filename = `rendezvous-backup-${Date.now()}.json`;
  try{
    if(navigator.canShare && window.File){
      const file = new File([text], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Rendezvous backup'});
        return;
      }
    }
    if(navigator.share){
      await navigator.share({title:'Rendezvous backup', text});
      return;
    }
    toast("Sharing isn't supported here — use Copy instead");
  }catch(e){ /* user cancelled the share sheet — not an error */ }
}
function copyBackupText(){
  const text = window.__lastBackupJson || '';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("Copied — paste it somewhere safe")).catch(()=>toast("Couldn't copy — select the text manually and copy it"));
  } else {
    toast("Select the text below and copy it manually");
  }
}
function importBackup(){
  const file = document.getElementById('restoreFile').files[0];
  if(!file) return toast("Choose a backup file first");
  const reader = new FileReader();
  reader.onload = async ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ toast("That file doesn't look like a valid backup — couldn't read it as JSON"); return; }
    let restoredCount = 0, failedKeys = [];
    for(const k of MIRROR_KEYS){
      if(data[k] !== undefined){
        STATE[k] = data[k];
        const ok = await saveKey(k, data[k]);
        if(ok) restoredCount++; else failedKeys.push(k);
      }
    }
    if(restoredCount===0){ toast("Nothing restorable found in that file"); return; }
    toast(failedKeys.length? `Restored ${restoredCount} parts, but ${failedKeys.join(', ')} failed — try again` : `Restored ${restoredCount} parts successfully`);
    render();
  };
  reader.readAsText(file);
}
const MIRROR_KEYS = ['settings','teams','students','competitions','posters','toppers','messages','notifications','published'];
function localMirrorSummary(){
  let newest = 0, found = 0;
  MIRROR_KEYS.forEach(k=>{ const m = mirrorLoad(k); if(m){ found++; if(m.at>newest) newest=m.at; } });
  if(!found) return "No local auto-backup on this device yet — it builds up as you use the site.";
  return `Last saved on this device: ${new Date(newest).toLocaleString()} (${found}/${MIRROR_KEYS.length} parts found).`;
}
function restoreFromMirror(){
  const have = MIRROR_KEYS.filter(k=>mirrorLoad(k));
  if(!have.length) return toast("No local auto-backup found on this device");
  openModal(`
    <h2>Restore from this device's auto-backup</h2>
    <div class="sub">${localMirrorSummary()} This will overwrite the shared data for everyone. Enter the admin password to confirm.</div>
    <input type="password" id="mirrorRestorePw" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="btnrow"><button class="btn danger" onclick="confirmRestoreFromMirror()">Restore now</button></div>
  `);
}
async function confirmRestoreFromMirror(){
  const v = document.getElementById('mirrorRestorePw').value;
  await pull('settings');
  if(v !== STATE.settings.adminPassword) return toast("Wrong password");
  for(const k of MIRROR_KEYS){
    const m = mirrorLoad(k);
    if(m){ STATE[k] = m.value; await saveKey(k, m.value); }
  }
  closeModal(); toast("Restored from this device's auto-backup"); render();
}
function adminGlobalSearch(q){
  q=q.toLowerCase();
  const box = document.getElementById('globalSearchResults');
  if(!q){ box.innerHTML=''; return; }
  const s = STATE.students.filter(x=>x.name.toLowerCase().includes(q)).slice(0,5);
  const e = STATE.competitions.filter(x=>x.name.toLowerCase().includes(q)).slice(0,5);
  const t = STATE.teams.filter(x=>x.name.toLowerCase().includes(q)).slice(0,5);
  box.innerHTML = `<div class="card">
    ${s.length?`<b style="font-size:12px;">Students</b>`+s.map(x=>`<div class="row"><div class="main"><b>${esc(x.name)}</b></div></div>`).join(''):''}
    ${e.length?`<b style="font-size:12px;">Events</b>`+e.map(x=>`<div class="row"><div class="main"><b>${esc(x.name)}</b></div></div>`).join(''):''}
    ${t.length?`<b style="font-size:12px;">Teams</b>`+t.map(x=>`<div class="row"><div class="main"><b>${esc(x.name)}</b></div></div>`).join(''):''}
    ${(!s.length&&!e.length&&!t.length)?'<div class="small-note">No matches</div>':''}
  </div>`;
}

  setTopbar(team? team.name : "Team Leader", `<button class="iconbtn" onclick="refreshNow()">🔄</button><button class="iconbtn" onclick="switchLeaderTab('notify')">🔔${unseenNotifCount()?`<span class="badge">${unseenNotifCount()}</span>`:''}</button><button class="iconbtn" onclick="logout()">⎋</button>`);
  setBottomNav([
    {id:'roster',icon:'🧑‍🤝‍🧑',label:'My Team'},
    {id:'register',icon:'📋',label:'Register'},
    {id:'events',icon:'🏆',label:'Events'},
    {id:'messages',icon:'💬',label:'Messages'},
    {id:'account',icon:'⚙️',label:'Account'},
  ], currentLeaderTab, 'switchLeaderTab');

function unseenNotifCount(){
  const seenAt = SESSION.notifSeenAt || 0;
  return STATE.notifications.filter(n=>n.time > seenAt).length;
}
function switchLeaderTab(id){
  currentLeaderTab=id;
  if(id==='notify') SESSION.notifSeenAt = Date.now();

}

function leaderRosterHtml(team){

    <div class="card"><h3>Published team points</h3><div class="pill accent" style="font-size:16px;padding:8px 14px;">${pts!=null? pts : '—'}</div></div>

}

function pastDeadline(){
  if(!STATE.settings.registrationDeadline) return false;
  return new Date() > new Date(STATE.settings.registrationDeadline);
}
function leaderRegisterHtml(team){
  const openEvents = STATE.competitions.filter(e=>e.status!=='ended');
  const locked = pastDeadline();
  return `
    ${locked? '<div class="card"><div class="small-note">Registration deadline has passed — you can view your list but can\'t add or remove students anymore.</div></div>':''}
    ${openEvents.length? openEvents.map(ev=>{
      const mine = (ev.participants||[]).filter(p=>{const s=STATE.students.find(x=>x.id===p.studentId); return s && s.teamId===team.id;});
      return `<div class="card">
        <h3>${esc(ev.name)} ${statusPill(ev)}</h3>
        <div class="small-note">${ev.category} · your team: ${mine.length}/${ev.maxPerTeam}</div>
        ${mine.length? mine.map(p=>{const s=STATE.students.find(x=>x.id===p.studentId); return `<div class="row"><div class="main"><b>${esc(s.name)}</b></div>${!locked && ev.status==='scheduled'? `<button class="linkbtn" onclick="leaderRemoveParticipant('${ev.id}','${p.studentId}')">Remove</button>`:''}</div>`;}).join('') : ''}
        <button class="btn outline small" style="margin-top:8px;" onclick="openLeaderRegister('${ev.id}')" ${(mine.length>=ev.maxPerTeam || locked || ev.status!=='scheduled')?'disabled':''}>+ Register a student</button>
      </div>`;
    }).join('') : '<div class="empty">No open events</div>'}
  `;
}
async function leaderRemoveParticipant(evId, sid){
  if(pastDeadline()) return toast("Deadline has passed");
  await pull('competitions');
  const ev = STATE.competitions.find(e=>e.id===evId);
  if(!ev) return toast("Event no longer exists");
  ev.participants = (ev.participants||[]).filter(p=>p.studentId!==sid);
  await save('competitions'); toast("Removed"); render();
}
function openLeaderRegister(evId){
  const ev = STATE.competitions.find(e=>e.id===evId);
  const team = STATE.teams.find(t=>t.id===SESSION.teamId);
  const eligible = STATE.students.filter(s=>s.teamId===team.id && (ev.category==='General' || s.category===ev.category)).filter(s=>!(ev.participants||[]).some(p=>p.studentId===s.id));
  if(!eligible.length) return toast("No eligible students to add");
  openModal(`
    <h2>Register for ${esc(ev.name)}</h2>
    <select id="lregStudent">${eligible.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
    <div class="btnrow"><button class="btn accent" onclick="confirmLeaderRegister('${evId}')">Register</button></div>
  `);
}
async function confirmLeaderRegister(evId){
  const sid = document.getElementById('lregStudent').value;
  const btn = event && event.target;
  if(btn){ btn.disabled = true; btn.textContent = 'Registering…'; }
  await pull('competitions'); await pull('students');
  const r = tryRegister(evId, sid);
  if(!r.ok){ if(btn){ btn.disabled=false; btn.textContent='Register'; } return toast(r.msg); }
  await save('competitions'); closeModal(); toast("Registered"); render();
}

function renderStudent(){
  setTopbar("Student", `<button class="iconbtn" onclick="refreshNow()">🔄</button><button class="iconbtn" onclick="logout()">⎋</button>`);
  document.getElementById('bottomnav').style.display='none';

function studentMatchesHtml(){

function posterMatchesHtml(){

  const posterQ = (SESSION.posterQuery||'').toLowerCase();
  const posterMatches = posterQ? posters.filter(p=>(p.caption||'').toLowerCase().includes(posterQ)) : posters;
  return posterMatches.length? posterMatches.map(p=>`<div style="margin-bottom:10px;">${p.caption? `<div class="small-note" style="margin-bottom:4px;">${esc(p.caption)}</div>`:''}<img class="poster-img" src="${p.url}" loading="lazy" decoding="async"><a class="btn outline small" download="poster.jpg" href="${p.url}">Download</a></div>`).join('') : (posterQ? '<div class="small-note">No posters match that name</div>' : '<div class="small-note">No posters published yet</div>');
}
function renderPosterMatchesOnly(){
  const wrap = document.getElementById('posterMatchesWrap');
  if(wrap) wrap.innerHTML = posterMatchesHtml();
}
function studentCardHtml(s){
  const events = STATE.competitions.filter(ev=>(ev.participants||[]).some(p=>p.studentId===s.id));
  const pts = STATE.published.teamPoints[s.teamId];
  return `<div class="card">
    <h3>${esc(s.name)}</h3>
    <div class="small-note">${s.category} · ${teamName(s.teamId)}</div>
    <label>Events</label>
    ${events.length? events.map(ev=>{
      let detail = statusPillPlain(ev);
      if(ev.category==='General'){
        const genMarks = STATE.published.results ? STATE.published.results[ev.id+'_general'] : null;
        const teamMark = genMarks ? genMarks[s.teamId] : null;
        if(teamMark!=null) detail += ` · ${teamMark} marks (shared with your team)`;
        else if(ev.status==='ended') detail += ' · result pending publish';
      } else {
        const pubList = STATE.published.results ? STATE.published.results[ev.id] : null;
        const pubEntry = pubList ? pubList.find(p=>p.studentId===s.id) : null;
        if(pubEntry && (pubEntry.grade||pubEntry.position||pubEntry.marks!=null)){
          detail += ' · ' + [pubEntry.grade, pubEntry.position? 'Pos '+pubEntry.position:null, pubEntry.marks!=null? pubEntry.marks+' marks':null].filter(Boolean).join(', ');
        } else if(ev.status==='ended'){
          detail += ' · result pending publish';
        }
      }
      return `<div class="row"><div class="main"><b>${esc(ev.name)}</b><span>${detail}</span></div></div>`;
    }).join('') : '<div class="small-note">No events registered</div>'}
    <label>Team's published points</label>
    <div class="pill accent">${pts!=null? pts : 'Not published yet'}</div>
  </div>`;
}

/* ---------------- util ---------------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------------- boot ---------------- */
(async function boot(){
  await loadAll();
  render();
  if(window.__RDV_LOCAL_ONLY && !window.__RDV_CLOUD_DB){
    toast("Local-only mode: data stays on this device only");
  }
  let refreshing = false;
  async function backgroundRefresh(){
    if((window.__RDV_LOCAL_ONLY && !window.__RDV_CLOUD_DB) || refreshing) return;
    const modalOpen = document.getElementById('overlay').classList.contains('show');
    const typing = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
    if(modalOpen || typing) return;
    refreshing = true;
    try{ await loadAll(); render(); }
    catch(e){ /* ignore transient errors */ }
    finally{ refreshing = false; }
  }
  if(sb){
    // Real-time: the moment anyone saves a change to the database, every
    // connected browser gets pushed the update instantly — no polling wait.
    try{
      sb.channel('rdv_kv_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rdv_kv' }, async (payload) => {
          const modalOpen = document.getElementById('overlay').classList.contains('show');
          const typing = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
          if(modalOpen || typing) return;
          const row = payload.new && payload.new.key ? payload.new : null;
          if(row && STATE){ STATE[row.key] = row.value; mirrorSave(row.key, row.value); render(); }
          else { await loadAll(); render(); }
        })
        .subscribe();
    }catch(e){ /* if realtime fails to connect, the poll below still covers us */ }
  }
  // Backup safety net even with realtime on: keep everyone's screen in sync
  // every ~18-24s (small random jitter so many phones don't hit storage at
  // the exact same second) in case a push update was ever missed.
  setInterval(backgroundRefresh, 18000 + Math.floor(Math.random()*6000));
})();
